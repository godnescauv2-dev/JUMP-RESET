name: Build Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Passo 1: JDK 17 pra gerar o gradlew (Gradle 9.7+ exige JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Generate gradlew (targeting Gradle 4.9)
        run: gradle wrapper --gradle-version 4.9

      # Passo 2: JDK 8 pra buildar o mod com ForgeGradle
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin

      - name: Setup Forge workspace
        run: ./gradlew setupDecompWorkspace

      - name: Build mod
        run: ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: JumpResetMod1.2
          path: build/libs/*.jar
