name: Build Forge 1.8.9

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.9
        run: |
          wget https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip
          echo "$PWD/gradle-4.9/bin" >> $GITHUB_PATH

      - name: Check Gradle version
        run: gradle --version

      - name: Build
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: JumpResetMod
          path: build/libs/*.jar
